name: Test and Lint

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Format Check
        run: |
          go fmt ./...
          git diff --exit-code

      - name: Go Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci-lint/golangci-lint-action@v6
        with:
          version: v2

      - name: Run Tests
        run: go test -v ./...
